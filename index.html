<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Libby — AI-Powered Library Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes particle {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translateY(-100vh) translateX(50px);
      opacity: 0;
    }
  }

  @keyframes spin3d {
    0% {
      transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg);
    }
    100% {
      transform: rotateY(360deg) rotateX(360deg) rotateZ(360deg);
    }
  }

  @keyframes rotate {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes rotateReverse {
    from {
      transform: rotate(360deg);
    }
    to {
      transform: rotate(0deg);
    }
  }

  @keyframes segmentPulse {
    0%, 100% {
      opacity: 0.3;
      transform: translate(-50%, -50%) rotate(var(--rotation)) translateY(-55px) scale(1);
    }
    50% {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(var(--rotation)) translateY(-55px) scale(1.2);
    }
  }

  @keyframes scan {
    0% {
      transform: translateY(-100%) rotate(0deg);
    }
    100% {
      transform: translateY(100%) rotate(360deg);
    }
  }

  @keyframes orbit {
    0% {
      transform: translate(-50%, -50%) rotate(0deg) translateX(30px);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg) translateX(30px);
    }
  }

  @keyframes float {
    0%, 100% {
      transform: translateY(0) translateX(0);
      opacity: 0.4;
    }
    50% {
      transform: translateY(-10px) translateX(5px);
      opacity: 1;
    }
  }

  @keyframes slideIn {
    from {
      width: 0;
      opacity: 0;
    }
    to {
      width: 2rem;
      opacity: 0.4;
    }
  }
</style>
<link rel="stylesheet" href="/index.css">
  </head>
  <body style="margin: 0; padding: 0; background: #111827; min-height: 100vh;">
    <div id="root" style="min-height: 100vh;">
      <div style="color: white; padding: 20px; font-family: monospace;">
        Loading Libby...
      </div>
    </div>
    <script>
      // Polyfill for Node.js global and process variables in browser (Safari compatibility)
      (function() {
        if (typeof global === 'undefined') {
          window.global = window.globalThis || window;
        }
        if (typeof process === 'undefined') {
          window.process = { env: {} };
        }
        // Additional Safari compatibility fixes
        if (!window.Promise.prototype.finally) {
          // Polyfill for Promise.finally if needed (older Safari)
          Promise.prototype.finally = function(callback) {
            return this.then(
              value => Promise.resolve(callback()).then(() => value),
              reason => Promise.resolve(callback()).then(() => { throw reason; })
            );
          };
        }
        console.log('HTML: Polyfills set, browser:', navigator.userAgent.includes('Safari') ? 'Safari' : 'Other');
        console.log('HTML: Global polyfill set, loading index.tsx...');
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
    <noscript>
      <div style="color: white; padding: 20px; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled. Please enable JavaScript and refresh the page.</p>
      </div>
    </noscript>
  </body>
</html>
