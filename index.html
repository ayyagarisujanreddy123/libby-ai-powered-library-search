<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libby — AI-Powered Library Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@18.3.1/index.mjs",
    "react/jsx-runtime": "https://aistudiocdn.com/react@18.3.1/jsx-runtime.mjs",
    "react-dom": "https://aistudiocdn.com/react-dom@18.3.1/index.mjs",
    "react-dom/client": "https://aistudiocdn.com/react-dom@18.3.1/client.mjs",
    "@google/genai": "https://aistudiocdn.com/@google/genai@0.14.0/dist/index.js",
    "framer-motion": "https://aistudiocdn.com/framer-motion@11.3.8/dist/framer-motion.mjs",
    "lucide-react": "https://aistudiocdn.com/lucide-react@0.417.0/dist/lucide-react.mjs",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes particle {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translateY(-100vh) translateX(50px);
      opacity: 0;
    }
  }

  @keyframes spin3d {
    0% {
      transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg);
    }
    100% {
      transform: rotateY(360deg) rotateX(360deg) rotateZ(360deg);
    }
  }

  @keyframes rotate {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes rotateReverse {
    from {
      transform: rotate(360deg);
    }
    to {
      transform: rotate(0deg);
    }
  }

  @keyframes segmentPulse {
    0%, 100% {
      opacity: 0.3;
      transform: translate(-50%, -50%) rotate(var(--rotation)) translateY(-55px) scale(1);
    }
    50% {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(var(--rotation)) translateY(-55px) scale(1.2);
    }
  }

  @keyframes scan {
    0% {
      transform: translateY(-100%) rotate(0deg);
    }
    100% {
      transform: translateY(100%) rotate(360deg);
    }
  }

  @keyframes orbit {
    0% {
      transform: translate(-50%, -50%) rotate(0deg) translateX(30px);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg) translateX(30px);
    }
  }

  @keyframes float {
    0%, 100% {
      transform: translateY(0) translateX(0);
      opacity: 0.4;
    }
    50% {
      transform: translateY(-10px) translateX(5px);
      opacity: 1;
    }
  }

  @keyframes slideIn {
    from {
      width: 0;
      opacity: 0;
    }
    to {
      width: 2rem;
      opacity: 0.4;
    }
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
