<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Libby — AI-Powered Library Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <!-- All keyframes & global styles live in index.css (no duplicates here) -->
    <link rel="stylesheet" href="/index.css">
  </head>
  <body style="margin: 0; padding: 0; background: #000; min-height: 100vh;">
    <div id="root" style="min-height: 100vh;">
      <!-- Branded loading state -->
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;">
        <div style="width:48px;height:48px;border:3px solid rgba(255,255,255,0.15);border-top-color:#3b82f6;border-radius:50%;animation:rotate 0.8s linear infinite;"></div>
        <span style="color:rgba(255,255,255,0.5);font-family:system-ui;font-size:14px;">Loading Libby...</span>
      </div>
    </div>
    <script>
      // Safari polyfills
      (function() {
        if (typeof global === 'undefined') window.global = window.globalThis || window;
        if (typeof process === 'undefined') window.process = { env: {} };
        if (!window.Promise.prototype.finally) {
          Promise.prototype.finally = function(cb) {
            return this.then(
              function(v) { return Promise.resolve(cb()).then(function() { return v; }); },
              function(r) { return Promise.resolve(cb()).then(function() { throw r; }); }
            );
          };
        }
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
    <noscript>
      <div style="color: white; padding: 20px; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>This application requires JavaScript to be enabled. Please enable JavaScript and refresh the page.</p>
      </div>
    </noscript>
  </body>
</html>
